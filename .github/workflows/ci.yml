name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
   check:
     runs-on: ubuntu-latest
     steps:
        - uses: actions/checkout@v4

        - uses: dtolnay/rust-toolchain@stable
          with:
            components: rustfmt, clippy

        - uses: Swatinem/rust-cache@v2

        - name: Format
          run: cargo fmt --all --check

        - name: Clippy
          run: cargo clippy --all-targets -- -D warnings

        - name: Check
          run: cargo check --all-targets

        # --all-targets so example tests run too: the capture tool's scrubber
        # is what keeps real account identifiers out of committed recordings,
        # and it is only covered there.
        - name: Test
          run: cargo test --all-targets

