[package]
name = "uncia"
version = "0.1.0"
edition = "2024"
description = "Drift detection for IaC that goes beyond value diffs — catches infrastructure that looks unchanged but no longer means what it used to."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/lazyihsan/uncia"

[lib]
name = "uncia"
path = "src/lib.rs"

[[bin]]
name = "uncia"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
aws-config = "1"
aws-sdk-ec2 = "1"
aws-sdk-ecs = "1.141.0"
aws-sdk-elasticloadbalancingv2 = "1"
aws-sdk-lambda = "1.141.0"
aws-sdk-rds = "1.147.0"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Likely addition once store::sqlite lands for real:
#   rusqlite — drift history persistence

# Replay-harness support: recorded AWS responses are fed back through the real
# SDK so collector tests exercise wire-format deserialization offline. See
# docs/TESTING.md.
[dev-dependencies]
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
http = "1"
regex = "1"
