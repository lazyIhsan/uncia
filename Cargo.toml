[package]
name = "uncia"
version = "0.1.0"
edition = "2024"
description = "Drift detection for IaC that goes beyond value diffs — catches infrastructure that looks unchanged but no longer means what it used to."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/lazyihsan/uncia"

[lib]
name = "uncia"
path = "src/lib.rs"

[[bin]]
name = "uncia"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Likely additions as implementation lands:
#   aws-config / aws-sdk-ec2 — AWS collectors (collector::aws)
#   tokio / async-trait      — async Collector trait
#   rusqlite                 — drift history persistence (store::sqlite)
#   ratatui / crossterm      — terminal UI (tui)
#   clap                     — CLI flag parsing (config, main)
